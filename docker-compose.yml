# KROBO system: service stack of the primary server.
#
#   docker compose up -d                       # database, Django, Caddy (no tunnel)
#   docker compose --profile tunnel up -d      # the same + Cloudflare tunnel (primary server only)
#
# Only the tunnel is reachable from outside; Caddy and database ports are bound to localhost.
name: krobo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krobo}
      POSTGRES_USER: ${POSTGRES_USER:-krobo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (scripts/init-env.py)}
      TZ: Europe/Warsaw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    image: krobo-web:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/srv/static
      - media:/srv/media
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      UPSTREAM: web:8000
      STATIC_PARENT: /srv
    ports:
      # Local access on the server: http://localhost:8080
      - "127.0.0.1:8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/"]
      interval: 15s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      caddy:
        condition: service_healthy

volumes:
  pgdata:
  static:
  media:
  caddy_data:
  caddy_config:
